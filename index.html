<!DOCTYPE html>
<html lang="ru">
<head>

<body>
  <header class="site-header" role="banner" aria-label="Заголовок сайта">
    <h1 class="site-title">Запчасти МАЗ</h1>
    <p class="seo-h2">
      Каталог запчастей МАЗ — Пенза и доставка по России

  </header>

  <div class="top-bar">
    <button id="show-all" type="button" aria-label="Показать весь каталог">Весь каталог</button>
  
    <div class="searchbar">
      <div class="search-wrapper">
        <input
          id="search-input"
          type="text"
          placeholder="Поиск по коду или названию…"
          aria-label="Поиск по коду или названию запчасти"

        />

      <!-- Индикатор загрузки -->
      <div id="loading-indicator" class="loading-spinner" style="display:none">
        <span></span>
      </div>

      <div id="suggestions" class="suggestions hidden" role="listbox" aria-live="polite"></div>
    </div>
  </div>

  <!-- Напоминание о контактах -->
  <div id="purchase-note" class="purchase-note hidden">
    Для покупки запчастей обращайтесь по телефону
    <a href="tel:+79991234567">📞 +7 (999) 123‑45‑67</a>.
  </div>

  <!-- Карточки запчастей -->
  <div id="cards-wrap" class="cards-wrap"></div>
  <div id="table-wrap"></div>

  <!-- Модалка -->
  <div id="modal" class="modal" aria-hidden="true" aria-modal="true" role="dialog">
    <button class="close" aria-label="Закрыть просмотр">&times;</button>
    <div class="modal-body">
      <img class="modal-content" id="modal-img" alt="Просмотр фото запчасти" loading="lazy" />
      <div class="contact-actions">
        <a href="tel:+79991234567" class="call-btn">📞 Позвонить</a>
        <a href="mailto:graf.p@mail.ru" class="mail-btn">✉️ graf.p@mail.ru</a>
      </div>
    </div>
  </div>

  <!-- Футер (новый: год + почта) -->
  <footer class="site-footer" role="contentinfo" aria-label="Футер сайта">
    <div>
      © <span id="site-year">2025</span> — маз‑запчасти.рф, Пенза
      <span style="margin-left:12px">|</span>
      <a href="mailto:graf.p@mail.ru" aria-label="Написать на почту">✉️ graf.p@mail.ru</a>
    </div>
  </footer>
  <!-- Скрипты -->
