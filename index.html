<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Каталог запчастей</title>

  <!-- SEO и соцсети -->
  <meta name="description" content="Каталог запчастей для грузовых автомобилей с удобным поиском, фото и контактами." />
  <meta name="keywords" content="запчасти, грузовые автомобили, каталог, купить, фото" />
  <meta property="og:title" content="Каталог запчастей для грузовых автомобилей" />
  <meta property="og:description" content="Быстрый поиск, фото и контактная информация" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="images/preview.jpg" />

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <!-- Стили -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Каталог запчастей для грузовых автомобилей</h1>

  <div class="top-bar">
    <button id="show-all" type="button" aria-label="Показать весь каталог">Весь каталог</button>
  
    <div class="searchbar">
      <div class="search-wrapper">
        <input
          id="search-input"
          type="text"
          placeholder="Поиск по коду или названию…"
          aria-label="Поиск по коду или названию запчасти"
          autocomplete="off"
        />
        <button id="clear-search" class="clear-btn" type="button" title="Очистить поиск" aria-label="Очистить поиск">&times;</button>
      </div>
    
      <button id="search-btn" type="button" aria-label="Начать поиск">Найти</button>

      <!-- Индикатор загрузки -->
      <div id="loading-indicator" class="loading-spinner" style="display:none">
        <span></span>
      </div>

      <div id="suggestions" class="suggestions hidden" role="listbox" aria-live="polite"></div>
    </div>
  </div>

  <!-- Напоминание о контактах -->
  <div id="purchase-note" class="purchase-note hidden">
    Для покупки запчастей обращайтесь по телефону
    <a href="tel:+79991234567">📞 +7 (999) 123‑45‑67</a>.
  </div>

  <!-- Таблица -->
  <div class="results" id="results">
    <div id="table-wrap" class="hidden" aria-describedby="purchase-note">
      <table id="parts-table" class="display" style="width:100%">
        <thead>
          <tr>
            <th scope="col">Код</th>
            <th scope="col">Фото</th>
            <th scope="col">Наименование</th>
          </tr>
        </thead>
        <tbody>
        <!-- Динамически заполняется через JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Карточки запчастей -->
  <div id="cards-wrap" class="cards-wrap"></div>

  <!-- Модалка -->
  <div id="modal" class="modal" aria-hidden="true" aria-modal="true" role="dialog">
    <button class="close" aria-label="Закрыть просмотр">&times;</button>
    <div class="modal-body">
      <img class="modal-content" id="modal-img" alt="Просмотр фото запчасти" loading="lazy" />
      <div class="contact-actions">
        <a href="tel:+79991234567" class="call-btn">📞 Позвонить</a>
        <a href="mailto:parts@example.com" class="mail-btn">✉️ Написать</a>
      </div>
    </div>
  </div>

  <!-- Футер -->
  <footer class="site-footer">
    <div class="footer-inner">
      <a href="tel:+79991234567" aria-label="Позвонить по телефону">📞 +7 (999) 123‑45‑67</a>
      <a href="mailto:parts@example.com" aria-label="Написать на email">✉️ parts@example.com</a>
      <span>🏢 г. Пенза, ул. Примерная, 15</span>
    </div>
  </footer>

  <!-- Скрипты -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js" defer></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js" defer></script>
  <script src="scripts/main.js" defer></script>
</body>
</html>
